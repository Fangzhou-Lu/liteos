    <text x="780" y="510" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#F7FAFC">rmdir · rename · write path</text>
    <text x="720" y="540" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#CBD5E0">中期</text>
    <text x="780" y="540" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#F7FAFC">第二个 FS 验证迁移性 (ext2 / erofs?)</text>
    <text x="720" y="570" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#CBD5E0">长期</text>
    <text x="780" y="570" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#F7FAFC">语义近似去重 (embedding_dedup)</text>
    <text x="780" y="592" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#F7FAFC">fast_eval batch harness</text>
    <text x="780" y="614" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#F7FAFC">DAG dirty propagation 自动化</text>
  </g>
