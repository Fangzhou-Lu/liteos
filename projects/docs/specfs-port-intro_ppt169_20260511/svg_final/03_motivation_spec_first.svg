<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#F7FAFC" />
    <rect x="0" y="0" width="1280" height="4" fill="#1A365D" />
  </g>
  <g id="header">
    <text x="60" y="62" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A365D">一次性 LLM 生 C ≠ 可信</text>
    <line x1="60" y1="86" x2="1220" y2="86" stroke="#CBD5E0" stroke-width="1" />
  </g>
  <g id="takeaway">
    <path fill="#EDF2F7" d="M68,100 H1212 A8,8 0 0 1 1220,108 V148 A8,8 0 0 1 1212,156 H68 A8,8 0 0 1 60,148 V108 A8,8 0 0 1 68,100 Z" />
    <text x="84" y="135" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#2D3748">把"做什么"和"怎么做"耦合在一次生成里 — review 时两类问题混在 diff 中；隔离 spec 把它们切成两步审。</text>
  </g>
  <g id="approach-a">
    <text x="60" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#C53030">A. 直生 C</text>
    <path fill="#FFFFFF" stroke="#C53030" stroke-width="2" d="M72,220 H398 A12,12 0 0 1 410,232 V588 A12,12 0 0 1 398,600 H72 A12,12 0 0 1 60,588 V232 A12,12 0 0 1 72,220 Z" />
    <text x="84" y="258" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D3748">单次 prompt</text>
    <path fill="#EDF2F7" d="M90,278 H380 A6,6 0 0 1 386,284 V330 A6,6 0 0 1 380,336 H90 A6,6 0 0 1 84,330 V284 A6,6 0 0 1 90,278 Z" />
    <text x="100" y="304" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#4A5568">"把这段 Linux exfat_mount</text>
    <text x="100" y="324" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#4A5568">移植到 LiteOS-A"</text>
    <text x="84" y="378" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D3748">输出</text>
    <text x="84" y="406" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#2D3748">200 行 C 代码</text>
    <text x="84" y="450" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#C53030">审查时</text>
    <text x="84" y="478" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#2D3748">• 这是行为缺陷吗？</text>
    <text x="84" y="506" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#2D3748">• 还是风格问题？</text>
    <text x="84" y="534" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#2D3748">• 还是 LLM 幻觉？</text>
    <text x="84" y="572" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C53030">三类混在一个 diff 里</text>
  </g>
  <g id="approach-b">
    <text x="450" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C7A7B">B. spec-first（论文 + 本项目）</text>
    <path fill="#FFFFFF" stroke="#2C7A7B" stroke-width="2" d="M462,220 H1208 A12,12 0 0 1 1220,232 V588 A12,12 0 0 1 1208,600 H462 A12,12 0 0 1 450,588 V232 A12,12 0 0 1 462,220 Z" />
    <g id="step-1">
      <path fill="#EDF2F7" d="M478,248 H682 A8,8 0 0 1 690,256 V340 A8,8 0 0 1 682,348 H478 A8,8 0 0 1 470,340 V256 A8,8 0 0 1 478,248 Z" />
      <text x="580" y="278" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A365D" text-anchor="middle">① Linux 源</text>
      <text x="580" y="308" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#4A5568" text-anchor="middle">fs/exfat/super.c</text>
      <text x="580" y="328" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#4A5568" text-anchor="middle">exfat_mount(...)</text>
    </g>
    <path d="M 695,298 L 730,298" stroke="#1A365D" stroke-width="2" fill="none" />
    <polygon points="730,298 720,292 720,304" fill="#1A365D" />
    <g id="step-2">
      <path fill="#EDF2F7" d="M743,248 H947 A8,8 0 0 1 955,256 V340 A8,8 0 0 1 947,348 H743 A8,8 0 0 1 735,340 V256 A8,8 0 0 1 743,248 Z" />
      <text x="845" y="278" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A365D" text-anchor="middle">② SYSSPEC spec</text>
      <text x="845" y="308" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#4A5568" text-anchor="middle">[PROMPT] [RELY]</text>
      <text x="845" y="328" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#4A5568" text-anchor="middle">[GUARANTEE] [SPEC]</text>
    </g>
    <path d="M 960,298 L 995,298" stroke="#1A365D" stroke-width="2" fill="none" />
    <polygon points="995,298 985,292 985,304" fill="#1A365D" />
    <g id="step-3">
      <path fill="#EDF2F7" d="M1008,248 H1192 A8,8 0 0 1 1200,256 V340 A8,8 0 0 1 1192,348 H1008 A8,8 0 0 1 1000,340 V256 A8,8 0 0 1 1008,248 Z" />
      <text x="1100" y="278" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A365D" text-anchor="middle">③ LiteOS-A C</text>
      <text x="1100" y="308" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#4A5568" text-anchor="middle">VfsExfatMount</text>
      <text x="1100" y="328" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#4A5568" text-anchor="middle">+ 七层防御</text>
    </g>
    <line x1="470" y1="380" x2="1200" y2="380" stroke="#CBD5E0" stroke-width="1" stroke-dasharray="4,4" />
    <text x="470" y="420" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D3748">审查时分两关</text>
    <text x="470" y="452" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#2D3748">关 1 · spec：行为契约是否对？Pre/Post-Condition / Invariants</text>
    <text x="470" y="480" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#2D3748">关 2 · code：实现是否忠实执行了 spec？libsec / 锁 / errno 风格</text>
    <text x="470" y="528" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C7A7B">两关问题不串台 — 认知负担分摊</text>
    <text x="470" y="572" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#718096">论文 §4.1 三段式 + 我们的 [GUARANTEE] 调用约定注释 + Refine Prompt 锁状态</text>
  </g>
  <g id="footer">
    <line x1="60" y1="670" x2="1220" y2="670" stroke="#CBD5E0" stroke-width="1" />
    <text x="60" y="694" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#718096">Motivation</text>
    <text x="1220" y="694" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#718096" text-anchor="end">03 / 22</text>
  </g>
</svg>