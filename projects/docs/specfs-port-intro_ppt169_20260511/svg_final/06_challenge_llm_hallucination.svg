  <g id="card-3">
    <path fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1" d="M852,190 H1208 A12,12 0 0 1 1220,202 V618 A12,12 0 0 1 1208,630 H852 A12,12 0 0 1 840,618 V202 A12,12 0 0 1 852,190 Z" />
    <path fill="#C53030" d="M852,190 H1208 A12,12 0 0 1 1220,202 V228 A12,12 0 0 1 1208,240 H852 A12,12 0 0 1 840,228 V202 A12,12 0 0 1 852,190 Z" />
