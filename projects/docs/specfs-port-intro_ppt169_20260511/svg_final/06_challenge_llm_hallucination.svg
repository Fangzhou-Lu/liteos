    <text x="880" y="335" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#C53030">printf("mount failed\n");</text>
    <text x="864" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#718096">华为安全编码 + 内核约束</text>
    <path fill="#EDF2F7" d="M870,392 H1190 A6,6 0 0 1 1196,398 V446 A6,6 0 0 1 1190,452 H870 A6,6 0 0 1 864,446 V398 A6,6 0 0 1 870,392 Z" />
    <text x="880" y="417" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2C7A7B">strncpy_s(buf, sz, name, len);</text>
    <text x="880" y="439" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2C7A7B">PRINT_ERR("mount failed\n");</text>
    <text x="864" y="492" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A365D">拦截层</text>
    <text x="864" y="514" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">Step 2.2 style audit</text>
