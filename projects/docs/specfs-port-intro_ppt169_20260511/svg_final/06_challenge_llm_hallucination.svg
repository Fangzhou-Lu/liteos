    <text x="864" y="268" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#718096">strcpy / memcpy / printf 直出</text>
    <path fill="#EDF2F7" d="M870,288 H1190 A6,6 0 0 1 1196,294 V342 A6,6 0 0 1 1190,348 H870 A6,6 0 0 1 864,342 V294 A6,6 0 0 1 870,288 Z" />
