    <path fill="#EDF2F7" d="M480,392 H800 A6,6 0 0 1 806,398 V446 A6,6 0 0 1 800,452 H480 A6,6 0 0 1 474,446 V398 A6,6 0 0 1 480,392 Z" />
    <text x="490" y="417" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2C7A7B">extern int exfat_get_dentry(</text>
