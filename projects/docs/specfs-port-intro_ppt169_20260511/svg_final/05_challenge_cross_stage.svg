    <text x="80" y="630" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#718096">深蓝=root · 青绿=已通过 · 砖红=新加</text>
  </g>
  <g id="rules">
    <path fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1" d="M792,180 H1208 A12,12 0 0 1 1220,192 V638 A12,12 0 0 1 1208,650 H792 A12,12 0 0 1 780,638 V192 A12,12 0 0 1 792,180 Z" />
    <text x="800" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D3748">DAG 节点结构</text>
    <rect x="800" y="226" width="400" height="40" fill="#EDF2F7" />
    <text x="816" y="252" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#4A5568">(spec, code, invariants, exports, depends_on)</text>
    <text x="800" y="296" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D3748">三条硬约束</text>
    <text x="800" y="324" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#2D3748">① 拓扑顺序：祖先 code 全 approved</text>
    <text x="800" y="346" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#2D3748">　 才能开始本 stage spec</text>
    <text x="800" y="378" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#2D3748">② Invariant 自动继承</text>
    <text x="800" y="400" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#2D3748">　 dag_extract_invariants(node_id)</text>
    <text x="800" y="432" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#2D3748">③ 祖先 spec 修订 → 后代 dirty 标记</text>
    <text x="800" y="454" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#2D3748">　 (need re-approval)</text>
    <path fill="#EDF2F7" d="M808,490 H1192 A8,8 0 0 1 1200,498 V622 A8,8 0 0 1 1192,630 H808 A8,8 0 0 1 800,622 V498 A8,8 0 0 1 808,490 Z" />
    <text x="820" y="518" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A365D">common.header 自动同步</text>
    <text x="820" y="544" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#4A5568">code_gen_approve 时自动从</text>
    <text x="820" y="566" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#4A5568">fs/&lt;m&gt;/*.c 抽 public exports</text>
    <text x="820" y="588" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#4A5568">追加 extern 声明 → 后代</text>
    <text x="820" y="610" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#4A5568">stage 直接看到</text>
  </g>
  <g id="footer">
    <line x1="60" y1="670" x2="1220" y2="670" stroke="#CBD5E0" stroke-width="1" />
