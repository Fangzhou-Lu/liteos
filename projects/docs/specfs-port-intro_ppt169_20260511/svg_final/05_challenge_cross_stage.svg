      <text x="410" y="266" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#F7FAFC" text-anchor="middle">mount</text>
      <text x="410" y="288" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#CBD5E0" text-anchor="middle">root · 7 invariants</text>
