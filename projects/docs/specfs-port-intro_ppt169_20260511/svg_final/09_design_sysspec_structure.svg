<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#F7FAFC" />
    <rect x="0" y="0" width="1280" height="4" fill="#1A365D" />
  </g>
  <g id="header">
    <text x="60" y="62" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A365D">SYSSPEC 规范结构：4 段必备 + 1 段可选</text>
    <line x1="60" y1="86" x2="1220" y2="86" stroke="#CBD5E0" stroke-width="1" />
  </g>
  <g id="takeaway">
    <path fill="#EDF2F7" d="M68,100 H1212 A8,8 0 0 1 1220,108 V148 A8,8 0 0 1 1212,156 H68 A8,8 0 0 1 60,148 V108 A8,8 0 0 1 68,100 Z" />
    <text x="84" y="135" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#2D3748">来源：FAST'26 SYSSPEC 论文 §4.1；本项目增强项：[GUARANTEE] 调用约定注释 + `## Refine Prompt` Phase 2 锁状态契约。</text>
  </g>
  <g id="prompt">
    <path fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1" d="M68,180 H632 A8,8 0 0 1 640,188 V272 A8,8 0 0 1 632,280 H68 A8,8 0 0 1 60,272 V188 A8,8 0 0 1 68,180 Z" />
    <rect x="60" y="180" width="6" height="100" fill="#1A365D" />
    <text x="84" y="208" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="18" font-weight="bold" fill="#1A365D">[PROMPT]</text>
    <text x="84" y="234" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">目标文件 · 头文件 · 输出规则 · 高层意图 · domain knowledge</text>
    <text x="84" y="258" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#718096">一段散文，告诉 codegen LLM 把代码追加到哪里、引用什么头</text>
  </g>
  <g id="rely">
    <path fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1" d="M68,290 H632 A8,8 0 0 1 640,298 V382 A8,8 0 0 1 632,390 H68 A8,8 0 0 1 60,382 V298 A8,8 0 0 1 68,290 Z" />
    <rect x="60" y="290" width="6" height="100" fill="#1A365D" />
    <text x="84" y="318" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="18" font-weight="bold" fill="#1A365D">[RELY]</text>
    <text x="84" y="344" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">真实 LiteOS-A 类型与辅助函数签名 (```c block)</text>
    <text x="84" y="368" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C53030">禁：Linux 原语 (kmalloc / mutex_lock) · 抽象描述 ("use a mutex")</text>
  </g>
  <g id="guarantee">
    <path fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1" d="M68,400 H632 A8,8 0 0 1 640,408 V492 A8,8 0 0 1 632,500 H68 A8,8 0 0 1 60,492 V408 A8,8 0 0 1 68,400 Z" />
    <rect x="60" y="400" width="6" height="100" fill="#1A365D" />
    <text x="84" y="428" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="18" font-weight="bold" fill="#1A365D">[GUARANTEE]</text>
    <text x="84" y="454" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">函数签名 + 调用约定注释块（返回值 / 副作用 / Phase 1 持锁状态）</text>
    <text x="84" y="478" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C53030">禁：Phase 2 锁状态（属 ## Refine Prompt）</text>
  </g>
  <g id="specification">
    <path fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1" d="M68,510 H632 A8,8 0 0 1 640,518 V622 A8,8 0 0 1 632,630 H68 A8,8 0 0 1 60,622 V518 A8,8 0 0 1 68,510 Z" />
    <rect x="60" y="510" width="6" height="120" fill="#1A365D" />
    <text x="84" y="538" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="18" font-weight="bold" fill="#1A365D">[SPECIFICATION]</text>
    <text x="84" y="564" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">Pre / Post-Condition · Case 1/2/... · <tspan font-weight="bold">Invariant (id=&lt;m&gt;-&lt;stage&gt;-&lt;noun&gt;)</tspan></text>
    <text x="84" y="588" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">+ <tspan font-weight="bold">System Algorithm</tspan> (项目级强制 — 论文只对 L3 强制)</text>
    <text x="84" y="612" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#718096">Invariant id 全局唯一 · 跨 stage 通过 DAG 自动继承</text>
  </g>
  <g id="refine">
    <path fill="#FFFFFF" stroke="#C53030" stroke-width="2" d="M672,180 H1208 A12,12 0 0 1 1220,192 V618 A12,12 0 0 1 1208,630 H672 A12,12 0 0 1 660,618 V192 A12,12 0 0 1 672,180 Z" />
    <rect x="660" y="180" width="6" height="450" fill="#C53030" />
    <text x="684" y="216" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="20" font-weight="bold" fill="#C53030">## Refine Prompt</text>
    <text x="684" y="246" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#718096">条件触发：函数路径取锁时必须有 (Phase 2)</text>
    <text x="684" y="290" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D3748">触发条件 (P1.5 hard gate)</text>
    <text x="684" y="316" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">1. Linux 源用 mutex_lock / spin_lock /</text>
    <text x="684" y="338" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">　 down_* / *_lock_irqsave，或</text>
    <text x="684" y="360" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">2. 草稿 [RELY] 前向声明 LOS_Mux* /</text>
    <text x="684" y="382" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">　 LOS_Spin* (struct 字段不算)</text>
    <text x="684" y="416" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D3748">Phase 2 内容</text>
    <text x="684" y="442" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">[RELY] 只含锁原语 (LOS_MuxLock 等)</text>
    <text x="684" y="464" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">[SPECIFICATION of &lt;fn&gt;]</text>
    <text x="684" y="486" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">　 Pre / Post (lock state) per case</text>
    <text x="684" y="508" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">　 锁初始化顺序约束</text>
    <text x="684" y="530" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">　 Deadlock note (AA/AB)</text>
    <text x="684" y="552" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2D3748">　 System Algorithm (locking phases)</text>
    <text x="684" y="586" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C53030">禁：重述 Phase 1 Cases · 改 signature</text>
    <text x="684" y="608" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C53030">　 · 在未触发时留空 placeholder</text>
  </g>
  <g id="footer">
    <line x1="60" y1="670" x2="1220" y2="670" stroke="#CBD5E0" stroke-width="1" />
    <text x="60" y="694" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#718096">Design</text>
    <text x="1220" y="694" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#718096" text-anchor="end">09 / 22</text>
  </g>
</svg>