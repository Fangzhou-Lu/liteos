  <g id="qemu-card">
    <path fill="#FFFFFF" stroke="#2C7A7B" stroke-width="2" d="M792,180 H1208 A12,12 0 0 1 1220,192 V618 A12,12 0 0 1 1208,630 H792 A12,12 0 0 1 780,618 V192 A12,12 0 0 1 792,180 Z" />
    <text x="800" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C7A7B">QEMU 端到端验证</text>
    <path fill="#2D3748" d="M806,226 H1194 A6,6 0 0 1 1200,232 V600 A6,6 0 0 1 1194,606 H806 A6,6 0 0 1 800,600 V232 A6,6 0 0 1 806,226 Z" />
    <text x="820" y="252" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#A0AEC0">$ qemu-system-arm \</text>
    <text x="820" y="272" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#A0AEC0">  -M virt -cpu cortex-a7 \</text>
    <text x="820" y="292" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#A0AEC0">  -bios OHOS_Image.bin \</text>
    <text x="820" y="312" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#A0AEC0">  -drive file=smallmmc.img \</text>
    <text x="820" y="332" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#A0AEC0">  -nographic</text>
    <text x="820" y="362" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F7FAFC">OHOS:/$ mount -t exfat \</text>
    <text x="820" y="382" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F7FAFC">         /dev/mmcblk0p3 /mnt/exfat</text>
    <text x="820" y="402" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2C7A7B">[OK] exfat mount ok</text>
    <text x="820" y="432" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F7FAFC">OHOS:/$ ls /mnt/exfat/etc</text>
    <text x="820" y="452" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2C7A7B">hostname  hosts  os-release</text>
    <text x="820" y="482" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F7FAFC">OHOS:/$ cat /mnt/exfat/etc/hosts</text>
    <text x="820" y="502" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2C7A7B">127.0.0.1 localhost</text>
    <text x="820" y="532" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F7FAFC">OHOS:/$ umount /mnt/exfat</text>
    <text x="820" y="552" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#2C7A7B">[OK] clean umount</text>
    <text x="820" y="582" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#A0AEC0">─ no kernel panic ─</text>
  </g>
