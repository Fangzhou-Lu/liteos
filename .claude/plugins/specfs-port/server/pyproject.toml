[project]
name = "specfs-port-server"
version = "0.1.0"
description = "MCP server for specfs-port plugin: stateful HITL spec→code workflow for LiteOS-A FS porting"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
